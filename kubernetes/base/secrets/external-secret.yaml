apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-external-secret
  namespace: postgres
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: secretstore
    kind: ClusterSecretStore
  target:
    name: postgres-external-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: fulfill-postgres-secret